# Standard r-lib R-CMD-check workflow for an R package that links to TMB.
# Runs on push / PR to master, main, and the dev integration branch, and on a
# weekly schedule (so silent upstream breakage in CRAN dependencies surfaces
# even on quiet weeks).
on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # Observed successful runs are 11-33 minutes (macOS ~11, Windows ~19,
    # ubuntu oldrel-1 ~33). 60 leaves headroom for a slow runner while failing
    # fast on a stalled one. Without it a job that hangs -- which happens when a
    # GitHub-hosted Ubuntu runner cannot reach the apt mirrors during setup-r --
    # sits until GitHub's 360-minute cap and reports as "cancelled", which reads
    # like a check failure rather than the infrastructure stall it is.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install system dependencies for TMB (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev \
            libblas-dev \
            liblapack-dev \
            gfortran \
            libssl-dev \
            libcurl4-openssl-dev \
            libxml2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          PAK_VERBOSE: true
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # setup-r-dependencies writes NOT_CRAN=true to $GITHUB_ENV, which would run
      # the full skip_on_cran() fit_mod() integration suite on EVERY OS in the
      # matrix. Those phased fits are multimodal and platform-sensitive -- on
      # Windows one settles in a different basin, its gradient blows up, and
      # sdreport crashes R (the check then fails with no test named). The multi-OS
      # check is meant to stay fast; the full fit suite runs on the coverage
      # workflow (ubuntu, NOT_CRAN=true). Override NOT_CRAN here -- via GITHUB_ENV,
      # after setup-r-dependencies, since a job-level env: would be shadowed by the
      # value it already exported -- so skip_on_cran() actually skips. See CLAUDE.md.
      - name: Keep the multi-OS check fast (skip fit_mod integration tests)
        shell: bash
        run: echo "NOT_CRAN=false" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # rtools45 + GCC 14.3 emits a spurious -Warray-bounds inside SSE2
          # intrinsics that we don't own; only fail on real errors.
          error-on: '"error"'
          # --as-cran would also flag the installed-size NOTE; drop it
          # if and when we slim the data/ directory.
          args: 'c("--no-manual", "--as-cran")'
